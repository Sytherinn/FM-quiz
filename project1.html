<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leverage and Capital Structure Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4fb;--card:#ffffff;--ink:#1b1f3a;--muted:#5b6080;--line:#d9dcf0;--accent:#4b4ae0;--accent-ink:#ffffff;--ok:#0e8f6e;--okbg:#dcf5ec;--no:#d63c4a;--nobg:#fde4e6;--hint:#fff2c2;--hintink:#5c4800;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142a;--card:#1c2040;--ink:#eef0ff;--muted:#a7acd1;--line:#343a6b;--accent:#8c8bff;--accent-ink:#12142a;--ok:#4fd7ae;--okbg:#12372f;--no:#ff7b86;--nobg:#42202a;--hint:#3d3512;--hintink:#ffe58a}}
:root[data-theme="dark"]{--bg:#12142a;--card:#1c2040;--ink:#eef0ff;--muted:#a7acd1;--line:#343a6b;--accent:#8c8bff;--accent-ink:#12142a;--ok:#4fd7ae;--okbg:#12372f;--no:#ff7b86;--nobg:#42202a;--hint:#3d3512;--hintink:#ffe58a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-size:17px;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1,h2,.display{font-family:"Fredoka","Trebuchet MS",sans-serif;font-weight:600;line-height:1.15;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;font-weight:700;color:var(--muted)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s ease}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px 20px}
.q{font-size:1.3rem;margin-bottom:16px}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-weight:700;text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:transform .12s ease,border-color .12s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-family:"Fredoka",sans-serif;font-size:.95rem}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--no);background:var(--nobg)}
.opt:disabled{cursor:default}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.btn{font:inherit;font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.05rem;border:0;border-radius:99px;padding:12px 26px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.hint{margin-top:14px;padding:10px 14px;border-radius:12px;background:var(--hint);color:var(--hintink);font-weight:700}
.fb{margin-top:16px;padding:14px 16px;border-radius:14px}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--nobg)}
.fb h2{font-size:1.25rem;margin-bottom:4px}
.fb.ok h2{color:var(--ok)}.fb.no h2{color:var(--no)}
.fb p{margin:0}
.hide{display:none}
.big{font-size:4.2rem;margin:6px 0}
.score{font-size:3rem;color:var(--accent)}
.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.center{text-align:center}
.sub{color:var(--muted);margin:10px 0 0}
</style>
</head>
<body>
<main>
<section id="start" class="card center">
<div class="big" aria-hidden="true">⚖️</div>
<h1 style="font-size:2rem">Leverage and Capital Structure Challenge</h1>
<p class="sub">10 questions on operating and financial leverage, and the NI, NOI, Traditional and MM approaches. Use the hint if you get stuck, but a streak of correct answers feels better.</p>
<div class="row" style="justify-content:center"><button class="btn" id="go">Start quiz</button></div>
</section>

<section id="play" class="hide">
<div class="top"><span id="count">Question 1 of 8</span><span id="streak" aria-live="polite">Streak: 0</span></div>
<div class="bar" aria-hidden="true"><i id="fill"></i></div>
<div class="card pop" id="qcard">
<h2 class="q" id="qtext"></h2>
<div class="opts" id="opts"></div>
<div class="hint hide" id="hint"></div>
<div class="fb hide" id="fb" aria-live="polite"><h2 id="fbh"></h2><p id="fbp"></p></div>
<div class="row"><button class="btn ghost" id="hintbtn">Show hint</button><button class="btn hide" id="next">Next question</button></div>
</div>
</section>

<section id="end" class="card center hide">
<div class="big" id="emoji" aria-hidden="true">🏆</div>
<h1>Your score</h1>
<div class="display score" id="final"></div>
<p class="sub" id="msg"></p>
<p class="sub" id="best"></p>
<div class="row" style="justify-content:center"><button class="btn" id="again">Play again</button></div>
</section>
</main>
<script>
var Q=[
{p:"Degree of Operating Leverage (DOL) is calculated as:",o:["EBIT ÷ EBT","Contribution ÷ EBIT","Sales ÷ Contribution","EBT ÷ Contribution"],c:1,h:"Operating leverage sits between sales and EBIT.",ok:"Spot on!",no:"Not this time.",e:"DOL = Contribution ÷ EBIT. It shows how a change in sales is magnified into a change in EBIT because of fixed operating costs."},
{p:"A firm has no debt and no preference share capital. Its Degree of Financial Leverage (DFL) will be:",o:["Zero","Infinity","Equal to DOL","1"],c:3,h:"DFL = EBIT ÷ EBT. What is EBT when interest is zero?",ok:"Exactly!",no:"Check EBT when interest is zero.",e:"With no interest, EBT = EBIT, so DFL = EBIT ÷ EBT = 1. There is no financial leverage effect."},
{p:"A firm has Contribution ₹4,00,000, EBIT ₹2,00,000 and EBT ₹1,00,000. What is its Degree of Combined Leverage (DCL)?",o:["2","3","4","8"],c:2,h:"DCL = DOL × DFL = Contribution ÷ EBT.",ok:"Great, you nailed the multiplication!",no:"Try DOL × DFL.",e:"DOL = 4,00,000 ÷ 2,00,000 = 2; DFL = 2,00,000 ÷ 1,00,000 = 2; DCL = 2 × 2 = 4. Equivalently, 4,00,000 ÷ 1,00,000 = 4."},
{p:"Which leverage measures the effect of a change in EBIT on Earnings Per Share (EPS)?",o:["Operating leverage","Financial leverage","Combined leverage","Working capital leverage"],c:1,h:"Think of the fixed charge that sits between EBIT and EPS.",ok:"Correct!",no:"Not quite. Think about interest.",e:"Financial leverage arises from fixed financial charges such as interest. It magnifies a change in EBIT into a larger change in EPS. DFL = % change in EPS ÷ % change in EBIT."},
{p:"According to the Net Income (NI) approach, as the firm uses more debt:",o:["Ko falls and the value of the firm rises","Ko rises and the value of the firm falls","Ko and the value of the firm stay constant","Ko is U-shaped"],c:0,h:"In the NI approach, both kd and ke stay constant, and debt is cheaper.",ok:"Right on!",no:"Not this one.",e:"The NI approach assumes constant kd and ke. Since debt is cheaper than equity, a larger share of debt lowers the weighted cost (Ko) and increases the value of the firm. Its extreme conclusion is 100% debt."},
{p:"NI approach: EBIT ₹2,00,000; debt ₹5,00,000 at 10%; ke = 15%. What is the value of the firm?",o:["₹13,33,333","₹10,00,000","₹20,00,000","₹15,00,000"],c:3,h:"NI = EBIT − Interest. Then S = NI ÷ ke, and V = S + D.",ok:"Numbers on point!",no:"Check your steps: NI, then S, then V.",e:"Interest = 50,000; NI = 1,50,000; S = 1,50,000 ÷ 0.15 = 10,00,000; V = 10,00,000 + 5,00,000 = ₹15,00,000. Then Ko = 2,00,000 ÷ 15,00,000 = 13.33%."},
{p:"Under the NOI approach, when the firm increases its debt, the cost of equity (ke):",o:["Falls","Rises","Stays constant","Becomes equal to kd"],c:1,h:"Cheap debt is offset by something. What do shareholders demand for extra risk?",ok:"Yes, higher risk, higher return!",no:"Shareholders aren’t that easygoing.",e:"Under the NOI approach, Ko is constant. Shareholders demand a higher return as financial risk rises, so ke increases and exactly offsets the benefit of cheaper debt. Capital structure therefore does not change the firm’s value."},
{p:"The Traditional approach suggests that the overall cost of capital (Ko), plotted against the debt ratio, is:",o:["A horizontal line","A downward sloping line","An upward sloping line","U-shaped, with an optimal point"],c:3,h:"It falls at first, then rises.",ok:"Perfect curve!",no:"Think about the shape of the curve.",e:"Ko falls as cheaper debt is added, reaches a minimum at the optimal capital structure, and then rises as ke and kd climb due to higher financial risk. The point of minimum Ko is where firm value is maximum."},
{p:"Modigliani and Miller (without taxes) proved that capital structure is irrelevant through:",o:["Break-even analysis","Arbitrage process","Trading on equity","Dividend discounting"],c:1,h:"Investors use homemade leverage to profit from price differences.",ok:"Arbitrage unlocked!",no:"MM relied on a different tool.",e:"MM showed that if a levered and an unlevered firm of the same risk had different values, investors could earn risk-free profit through arbitrage (using personal borrowing, called homemade leverage). This process pushes the values to equality."},
{p:"MM with corporate tax: unlevered firm value ₹40,00,000; debt ₹10,00,000; tax rate 30%. What is the value of the levered firm?",o:["₹40,00,000","₹43,00,000","₹47,00,000","₹50,00,000"],c:1,h:"V(L) = V(U) + t × D",ok:"Shielded from error!",no:"Don’t forget the tax shield, tD.",e:"Tax shield = 0.30 × 10,00,000 = ₹3,00,000. V(L) = 40,00,000 + 3,00,000 = ₹43,00,000."}
];
var $=function(i){return document.getElementById(i)};
var i=0,score=0,streak=0,answered=false,order=[];
function shuffle(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t}return a}
function show(id){["start","play","end"].forEach(function(s){$(s).classList.toggle("hide",s!==id)})}
function start(){i=0;score=0;streak=0;show("play");render()}
function render(){
var q=Q[i];answered=false;
$("count").textContent="Question "+(i+1)+" of "+Q.length;
$("streak").textContent="Streak: "+streak;
$("fill").style.width=(i/Q.length*100)+"%";
$("qtext").textContent=q.p;
$("hint").classList.add("hide");$("hint").textContent="";
$("fb").classList.add("hide");$("next").classList.add("hide");
$("hintbtn").classList.remove("hide");
$("next").textContent=i===Q.length-1?"See my score":"Next question";
var box=$("opts");box.innerHTML="";
order=shuffle(q.o.map(function(t,n){return{t:t,r:n===q.c}}));
order.forEach(function(op,n){
var b=document.createElement("button");b.className="opt";
var l=document.createElement("b");l.textContent="ABCD".charAt(n);
var s=document.createElement("span");s.textContent=op.t;
b.appendChild(l);b.appendChild(s);
b.onclick=function(){pick(n)};box.appendChild(b)});
var c=$("qcard");c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop");
}
function pick(n){
if(answered)return;answered=true;
var q=Q[i],right=order[n].r;
var btns=$("opts").children;
for(var k=0;k<btns.length;k++){btns[k].disabled=true;if(order[k].r)btns[k].classList.add("ok")}
if(right){score++;streak++}else{btns[n].classList.add("no");streak=0}
$("streak").textContent="Streak: "+streak+(streak>=3?" 🔥":"");
var fb=$("fb");fb.className="fb "+(right?"ok":"no");
$("fbh").textContent=right?q.ok:q.no;$("fbp").textContent=q.e;
$("hintbtn").classList.add("hide");$("hint").classList.add("hide");
$("next").classList.remove("hide");$("next").focus();
}
function finish(){
$("fill").style.width="100%";show("end");
$("final").textContent=score+" / "+Q.length;
var m,e;
if(score===Q.length){m="Perfect score. You could run the finance department.";e="🏆"}
else if(score>=6){m="Strong work. Review the questions you missed and you’re set.";e="🎉"}
else if(score>=4){m="Good start. Revisit the formulas for debt, equity and WACC, then try again.";e="📚"}
else{m="Time to revisit the notes. Every expert started here.";e="💪"}
$("msg").textContent=m;$("emoji").textContent=e;
var bestv=null;
try{bestv=parseInt(localStorage.getItem("lev-best"),10);if(isNaN(bestv))bestv=null}catch(x){}
if(bestv===null||score>bestv){bestv=score;try{localStorage.setItem("lev-best",String(score))}catch(x){}}
$("best").textContent="Your best on this device: "+bestv+" / "+Q.length;
}
$("go").onclick=start;$("again").onclick=start;
$("next").onclick=function(){i++;if(i>=Q.length)finish();else render()};
$("hintbtn").onclick=function(){var h=$("hint");h.textContent="Hint: "+Q[i].h;h.classList.remove("hide")};
</script>
</body>
</html>
